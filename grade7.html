<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="翰林版國七上 Unit 1–2 段考單字複習：聽音拼字、字母方塊、康乃爾筆記，全部有發音。">
<meta property="og:title" content="國七上單字拼字蜂">
<meta property="og:description" content="翰林版國七上 Unit 1–2 段考單字複習：聽音拼字、字母方塊、康乃爾筆記，全部有發音。">
<title>國七上單字拼字蜂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bungee&display=swap">
<style>
/* Layout: a honey-yellow desk with one "Word Note" notebook page in the middle — thick ink borders, sky-blue word headers, orange pen for Chinese, three review check boxes per word. */
:root{
  --ground:#F2C33F;      /* honey desk */
  --paper:#FFFDF5;       /* notebook page */
  --paper-2:#FFF6DA;     /* tinted rows / inputs */
  --ink:#1F1D18;         /* thick borders + text */
  --muted:#6B6352;
  --sky:#D9E5F5;         /* word header band */
  --ember:#C95F17;       /* orange pen */
  --leaf:#24804A;        /* correct */
  --miss:#C2352B;        /* wrong */
  --line:#E7DCBE;
  --font-display:"Bungee","Arial Black",Impact,sans-serif;
  --font-word:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  --font-zh:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#2A2312;--paper:#1C1A16;--paper-2:#26231C;--ink:#F1E7CC;--muted:#ADA28A;
  --sky:#27344A;--ember:#F3A15E;--leaf:#5CC487;--miss:#F07468;--line:#3A3526;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#2A2312;--paper:#1C1A16;--paper-2:#26231C;--ink:#F1E7CC;--muted:#ADA28A;
  --sky:#27344A;--ember:#F3A15E;--leaf:#5CC487;--miss:#F07468;--line:#3A3526;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--font-zh);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.chip:focus-within{outline:3px solid var(--ember);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0}
.logo svg{width:44px;height:44px;flex:none}
.logo h1{font-family:var(--font-display);font-size:clamp(22px,5vw,32px);line-height:1;margin:0;letter-spacing:.02em}
.logo small{display:block;font-family:var(--font-zh);font-size:13px;color:var(--ink);opacity:.75;letter-spacing:.04em;margin-top:4px}
.top .spacer{flex:1}
.prefs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:4px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* notebook page */
.page{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:20px;min-width:0}
.page-title{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:clamp(18px,4vw,24px);letter-spacing:.06em;margin:0}
.page-title::before,.page-title::after{content:"";flex:1;border-top:4px dashed var(--ink);opacity:.8}
.date{align-self:flex-end;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;margin-top:-14px}
.date b{font-family:var(--font-word);color:var(--ember);font-size:15px}

.step{display:flex;flex-direction:column;gap:10px}
.step h2{font-size:15px;margin:0;display:flex;gap:8px;align-items:center;letter-spacing:.04em}
.step h2 .n{font-family:var(--font-display);background:var(--ink);color:var(--paper);width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grade{border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.grade b{font-size:20px}
.grade span{font-size:13px;color:var(--muted)}
.grade[aria-pressed="true"]{background:var(--sky);box-shadow:4px 4px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--paper);font-size:14px;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .box{width:18px;height:18px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:13px;color:var(--ember);font-weight:700;flex:none}
.chip:has(input:checked){background:var(--sky)}
.chip:has(input:checked) .box::after{content:"✔"}
.chip em{font-style:normal;font-family:var(--font-word);color:var(--muted);font-size:13px}
.count-line{font-size:14px;color:var(--muted)}
.count-line b{color:var(--ink);font-family:var(--font-word);font-size:18px}
.peek{font-family:var(--font-word);color:var(--ember);font-size:15px;overflow-wrap:anywhere}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.modes .mode:first-child{grid-column:span 2}
@media (min-width:700px){.modes{grid-template-columns:repeat(6,minmax(0,1fr))}.modes .mode{grid-column:span 2}.modes .mode:nth-child(-n+2){grid-column:span 3}}
.mode{border:3px solid var(--ink);border-radius:var(--r);background:var(--paper-2);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s}
.mode:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.mode .en{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;color:var(--ember)}
.mode b{font-size:18px}
.mode span{font-size:13px;color:var(--muted)}
.mode.main{background:var(--sky)}
.qcount{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}

/* buttons */
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 16px;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.honey{background:var(--ground);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* game */
.hud{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.bar{flex:1;min-width:120px;height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ember);width:0;transition:width .3s}
.hud .num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.speakers{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.big-say{width:92px;height:92px;border-radius:50%;border:3px solid var(--ink);background:var(--ground);display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink)}
.big-say svg{width:44px;height:44px}
.big-say:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.big-say.playing{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.meaning{display:grid;grid-template-columns:minmax(0,1fr) auto;border:3px solid var(--ink);border-radius:6px;overflow:hidden}
.meaning .zh{padding:12px 16px;font-size:clamp(20px,5vw,28px);color:var(--ember);font-weight:700;border-right:3px solid var(--ink);min-width:0}
.pos{display:grid;grid-template-columns:repeat(3,auto);gap:4px 10px;padding:10px 12px;font-size:12px;font-family:var(--font-word);align-content:center}
.pos span{display:flex;align-items:center;gap:4px;color:var(--muted)}
.pos span::before{content:"";width:13px;height:13px;border:1.5px solid var(--muted);border-radius:3px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.pos span.on{color:var(--ink);font-weight:700}
.pos span.on::before{content:"✔";color:var(--ember);border-color:var(--ink)}
.shape{font-family:var(--font-word);font-size:clamp(20px,5vw,28px);letter-spacing:.18em;text-align:center;min-height:1.6em;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);text-align:center}
.answer{width:100%;font-family:var(--font-word);font-size:clamp(24px,6vw,34px);text-align:center;padding:10px 12px;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper-2);color:var(--ink)}
.answer.ok{border-color:var(--leaf)}
.answer.bad{border-color:var(--miss);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{border-top:3px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.verdict{font-family:var(--font-display);font-size:22px;letter-spacing:.05em}
.verdict.ok{color:var(--leaf)} .verdict.bad{color:var(--miss)}
.reveal{font-family:var(--font-word);font-size:clamp(28px,7vw,42px);font-weight:700;overflow-wrap:anywhere}
.reveal .ok{color:var(--leaf)} .reveal .bad{color:var(--miss);text-decoration:underline 3px}
.yours{font-family:var(--font-word);color:var(--muted);text-decoration:line-through}
.syll{font-family:var(--font-word);font-size:18px;color:var(--ember);letter-spacing:.04em}

/* tiles */
.slots{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.slot-word{display:flex;gap:4px}
.slot,.tile{width:clamp(34px,8.5vw,46px);height:clamp(42px,10vw,54px);border-radius:8px;font-family:var(--font-word);font-size:clamp(20px,5vw,26px);font-weight:700;display:grid;place-items:center;padding:0}
.slot{border:2px dashed var(--ink);background:var(--paper-2)}
.slot.filled{border-style:solid;background:var(--sky)}
.slot.bad{border-color:var(--miss);color:var(--miss)}
.slot.ok{border-color:var(--leaf);color:var(--leaf)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--ink);background:var(--ground);box-shadow:2px 3px 0 var(--ink)}
.tile:disabled{visibility:hidden}

/* word notes */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notes{display:flex;flex-direction:column;gap:14px}
.wn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);border:3px solid var(--ink);border-radius:4px;background:var(--paper)}
.wn .w{background:var(--sky);border-right:3px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wn .w .word{display:flex;align-items:center;gap:8px;font-family:var(--font-word);font-size:22px;font-weight:700;color:var(--ember);overflow-wrap:anywhere}
.wn .w .syllables{font-family:var(--font-word);font-size:14px;color:var(--muted)}
.wn .m{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wn .m .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wn .m .zh{font-size:20px;font-weight:700;color:var(--ember)}
.wn .pos{padding:0;grid-template-columns:repeat(4,auto);justify-content:start}
.checks{display:flex;gap:4px;flex:none}
.checks i{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-style:normal;color:var(--ember);font-weight:700;font-size:16px;line-height:1}
.checks i.on::after{content:"✔"}
.mini-say{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;padding:0;flex:none}
.mini-say svg{width:16px;height:16px}
.cover{background:repeating-linear-gradient(-45deg,var(--paper-2) 0 8px,var(--line) 8px 16px);border-radius:6px;color:transparent!important;cursor:pointer;user-select:none}
.cover *{visibility:hidden}
.group-h{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;margin:6px 0 -4px;color:var(--muted)}

/* cornell notes */
.cornell{border:3px solid var(--ink);border-radius:4px;background:var(--paper);display:flex;flex-direction:column}
.cn-head{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:3px solid var(--ink);background:var(--sky)}
.cn-head h3{margin:0;font-size:17px}
.cn-head h3 span{font-family:var(--font-word);color:var(--ember)}
.cn-head .who{font-size:13px;color:var(--muted)}
.cn-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.cn-label{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;color:var(--muted);padding:6px 12px;border-bottom:2px solid var(--line)}
.cn-label.l{background:var(--paper-2);border-right:3px solid var(--ink)}
.cn-sec{display:contents}
.cn-sec .q{grid-column:1;background:var(--paper-2);border-right:3px solid var(--ink);padding:12px 12px 4px;color:var(--ember);font-weight:700;font-size:15px}
.cn-sec .s{grid-column:2;padding:12px 12px 4px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.cn-row{display:contents}
.cn-row .cue{background:var(--paper-2);border-right:3px solid var(--ink);padding:5px 12px;display:flex;align-items:center;gap:8px;font-family:var(--font-word);font-size:18px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.cn-row .nt{padding:5px 12px;border-bottom:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;min-width:0}
.cn-row .nt .sy{font-family:var(--font-word);color:var(--muted)}
.cn-row .nt .z{color:var(--ember);font-weight:700}
.cn-row .nt .p{font-family:var(--font-word);font-size:13px;border:1.5px solid var(--ink);border-radius:4px;padding:0 5px}
.cn-sum{border-top:3px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cn-sum b.t{font-family:var(--font-display);font-size:12px;letter-spacing:.1em}
.cn-sum ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.cn-sum em{font-style:normal;font-family:var(--font-word);color:var(--ember);font-weight:700}
.cornell.recall .nt>*{visibility:hidden}
.cornell.recall .nt{background:repeating-linear-gradient(-45deg,var(--paper) 0 8px,var(--paper-2) 8px 16px);cursor:pointer}
.cornell.recall .nt.peek>*{visibility:visible}
.cornell.recall .nt.peek{background:none}
@media (max-width:560px){.cn-cols{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.cn-row .cue{font-size:16px}}

/* results */
.score-big{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;text-align:center}
.score-big div{display:flex;flex-direction:column}
.score-big b{font-family:var(--font-display);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.score-big span{font-size:13px;color:var(--muted)}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ritem{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.ritem .mk{font-weight:700;flex:none;width:18px}
.ritem.ok .mk{color:var(--leaf)} .ritem.bad .mk{color:var(--miss)}
.ritem .t{min-width:0;flex:1}
.ritem .t b{font-family:var(--font-word);display:block;overflow-wrap:anywhere}
.ritem .t small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.warn{background:var(--paper-2);border:2px dashed var(--miss);border-radius:8px;padding:8px 12px;font-size:14px}

@media (max-width:560px){
  .wn,.meaning{grid-template-columns:1fr}
  .wn .w{border-right:0;border-bottom:3px solid var(--ink)}
  .meaning .zh{border-right:0;border-bottom:3px solid var(--ink)}
  .pos{grid-template-columns:repeat(4,auto);justify-content:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <button class="logo" id="homeBtn" aria-label="回首頁">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 13.5v21L24 45 6 34.5v-21Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/><ellipse cx="24" cy="26" rx="8" ry="10" fill="var(--ground)" stroke="var(--ink)" stroke-width="2.5"/><path d="M16.5 23h15M16.5 29h15" stroke="var(--ink)" stroke-width="2.5"/><ellipse cx="17" cy="15" rx="5" ry="3.5" fill="var(--sky)" stroke="var(--ink)" stroke-width="2"/><ellipse cx="31" cy="15" rx="5" ry="3.5" fill="var(--sky)" stroke="var(--ink)" stroke-width="2"/></svg>
      <span><h1>SPELLING BEE</h1><small>翰林版 115 學年度・段考單字衝刺</small></span>
    </button>
    <div class="spacer"></div>
    <div class="prefs">
      <span>發音</span>
      <div class="seg" role="group" aria-label="口音">
        <button id="accUS" aria-pressed="true">美式</button><button id="accUK" aria-pressed="false">英式</button>
      </div>
      <div class="seg" role="group" aria-label="語速">
        <button id="rateN" aria-pressed="true">正常</button><button id="rateS" aria-pressed="false">慢速</button>
      </div>
    </div>
  </header>

  <div id="ttsWarn" class="warn" hidden>這個瀏覽器沒有英文發音功能。請改用 Chrome、Edge 或 Safari 開啟。</div>

  <!-- SETUP -->
  <section class="page" id="vSetup">
    <h2 class="page-title">WORD NOTE</h2>
    <div class="date">DATE <b id="today"></b></div>

    <div class="step">
      <h2><span class="n">1</span>選年級</h2>
      <div class="grades">
        <button class="grade" id="g7" aria-pressed="true"><b>七年級・國七上</b><span>Unit 1 Who's That? ／ Unit 2 Where's the Comic Book?</span></button>
        <button class="grade" id="g9" aria-pressed="false"><b>九年級・國九上</b><span>Unit 1 Have You Ever Been to an Art Museum? ／ Unit 2 The Movie Looks Exciting</span></button>
      </div>
    </div>

    <div class="step">
      <h2><span class="n">2</span>選範圍</h2>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="u1" checked><span class="box"></span>Unit 1</label>
        <label class="chip"><input type="checkbox" id="u2" checked><span class="box"></span>Unit 2</label>
        <label class="chip"><input type="checkbox" id="tCore" checked><span class="box"></span>應用字彙</label>
        <label class="chip"><input type="checkbox" id="tExtra"><span class="box"></span><span id="extraLabel">國小奠基字彙</span></label>
        <label class="chip"><input type="checkbox" id="tPhrase" checked><span class="box"></span>含片語・口語</label>
      </div>
      <div class="count-line">已選 <b id="nSel">0</b> 個字：<span class="peek" id="peek"></span></div>
    </div>

    <div class="step">
      <h2><span class="n">3</span>選玩法</h2>
      <div class="qcount">每回題數
        <div class="seg" role="group" aria-label="題數">
          <button data-q="10" aria-pressed="false">10 題</button><button data-q="20" aria-pressed="true">20 題</button><button data-q="all" aria-pressed="false">全部</button>
        </div>
      </div>
      <div class="modes">
        <button class="mode main" id="mSpell"><span class="en">SPELLING BEE</span><b>聽音拼字</b><span>聽發音、看中文，把整個字打出來。段考聽寫就是這樣考。</span></button>
        <button class="mode" id="mTiles"><span class="en">LETTER TILES</span><b>字母方塊</b><span>點字母排出單字，適合剛開始背、或用手機複習。</span></button>

};

/* ---------- speech ---------- */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() { if (synth) voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang)); }
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; } else { document.getElementById("ttsWarn").hidden = false; }
function pickVoice() {
  const want = prefs.accent === "UK" ? /en[-_]GB/i : /en[-_]US/i;
  const pool = voices.filter(v => want.test(v.lang));
  const pref = /Google|Samantha|Aria|Jenny|Natural|Daniel|Libby|Sonia|Serena/i;
  return pool.find(v => pref.test(v.name)) || pool[0] || voices[0] || null;
}
function speak(text, opts = {}) {
  if (!synth) return Promise.resolve();

  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v) u.voice = v;
    u.lang = v ? v.lang : (prefs.accent === "UK" ? "en-GB" : "en-US");
    u.rate = opts.rate || (prefs.slow ? 0.6 : 0.9);
    const btn = opts.btn; if (btn) btn.classList.add("playing");
    u.onend = u.onerror = () => { if (btn) btn.classList.remove("playing"); res(); };
    synth.speak(u);
  });
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z" fill="var(--ink)"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>';

/* ---------- cornell notes ---------- */

/* ---------- game ---------- */
let G = null;
function startGame(mode, queue) {
  if (!queue.length) return;
  G = { mode, queue, i: 0, score: 0, streak: 0, best: 0, results: [], hint: 0, answered: false, tries: 0 };
  $("spellForm").hidden = mode !== "spell";
  $("tileArea").hidden = mode !== "tiles";
  show("vGame");
  nextQ();
}
function cur() { return G.queue[G.i]; }
function nextQ() {
  if (G.i >= G.queue.length) return finish();
  const w = cur();
  G.hint = 0; G.answered = false; G.tries = 0;
  $("hProg").textContent = `${G.i + 1} / ${G.queue.length}`;
  $("hBar").style.width = (G.i / G.queue.length * 100) + "%";
  $("hScore").textContent = G.score; $("hStreak").textContent = G.streak;
  $("qZh").textContent = w.zh;
  $("qPos").innerHTML = posHTML(w);
  $("qShape").textContent = "";
  $("qNote").textContent = w.gap ? "「…」的部分不用打，只拼出固定的字。" : (w.phrase ? "這題是片語，字和字之間要空格。" : "");
  $("hintBtn").disabled = G.mode === "tiles";
  $("hintBtn").textContent = "給我提示";
  $("fb").hidden = true;
  const a = $("ans"); a.value = ""; a.className = "answer"; a.disabled = false;
  $("checkBtn").disabled = false; $("skipBtn").disabled = false;
  if (G.mode === "tiles") buildTiles(w); else a.focus();
  setTimeout(() => speak(sayText(w), { btn: $("sayBtn") }), 250);
}
$("sayBtn").onclick = () => speak(sayText(cur()), { btn: $("sayBtn") });
$("slowBtn").onclick = () => speak(sayText(cur()), { btn: $("sayBtn"), rate: 0.5 });
$("hintBtn").onclick = () => {
  const w = cur(); if (G.answered) return;
  G.hint = Math.min(2, G.hint + 1);
  if (G.hint === 1) {
    $("qShape").textContent = w.plain.replace(/[A-Za-z]/g, "_");
    $("hintBtn").textContent = "再多一點提示";
  } else {
    // first letter of every syllable shown
    const parts = w.syll.replace("(s)", "s").replace(/\.\.\./g, " ").replace(/[.,!?]/g, "").trim().split(/\s+/);
    $("qShape").textContent = parts.map(word => word.split("-").map(s => s[0] + s.slice(1).replace(/[A-Za-z]/g, "_")).join("·")).join("   ");
    $("hintBtn").disabled = true;
  }
  $("ans").focus();
};

function diffMarks(ans, tgt) {
  // Levenshtein alignment: mark each target letter ok / bad
  const a = ans.toLowerCase(), t = tgt.toLowerCase(), n = a.length, m = t.length;
  const D = Array.from({ length: n + 1 }, (_, i) => Array.from({ length: m + 1 }, (_, j) => i === 0 ? j : j === 0 ? i : 0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === t[j - 1] ? 0 : 1));
  const marks = Array(m).fill("bad"); let i = n, j = m;
  while (i > 0 && j > 0) {
    if (a[i - 1] === t[j - 1] && D[i][j] === D[i - 1][j - 1]) { marks[j - 1] = "ok"; i--; j--; }
    else if (D[i][j] === D[i - 1][j - 1] + 1) { i--; j--; }
    else if (D[i][j] === D[i][j - 1] + 1) { j--; }
    else { i--; }
  }
  return marks;
}

function grade(ok, typed) {
  const w = cur();
  G.answered = true;
  const pts = ok ? (G.mode === "tiles" ? (G.tries <= 1 ? 10 : 5) : [10, 7, 4][G.hint]) : 0;
  G.score += pts;
  G.streak = ok ? G.streak + 1 : 0; G.best = Math.max(G.best, G.streak);
  G.results.push({ id: w.id, ok, typed });
  if (ok) {
    mastery[w.id] = Math.min(3, (mastery[w.id] || 0) + 1);
    if (wrongBook[w.id]) { wrongBook[w.id]--; if (!wrongBook[w.id]) delete wrongBook[w.id]; }
  } else {
    mastery[w.id] = Math.max(0, (mastery[w.id] || 0) - 1);
    wrongBook[w.id] = (wrongBook[w.id] || 0) + 1;
  }
  store.set("mastery", mastery); store.set("wrong", wrongBook);
  $("hScore").textContent = G.score; $("hStreak").textContent = G.streak;
  $("fbVerdict").textContent = ok ? (pts === 10 ? "PERFECT! +10" : `CORRECT +${pts}`) : "再加油";
  $("fbVerdict").className = "verdict " + (ok ? "ok" : "bad");
  $("fbYours").textContent = !ok && typed ? `你拼的：${typed}` : "";
  const marks = ok ? null : diffMarks(typed || "", w.plain);
  $("fbWord").innerHTML = w.plain.split("").map((c, k) => `<span class="${ok || marks[k] === "ok" ? "ok" : (c === " " ? "" : "bad")}">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");
  $("fbSyll").textContent = w.syll.replace(/-/g, " · ") + "　" + w.zh;
  $("fb").hidden = false;
  $("hintBtn").disabled = true; $("checkBtn").disabled = true; $("skipBtn").disabled = true;
  $("ans").disabled = true;
  $("nextBtn").focus();
  if (!ok) setTimeout(() => speak(sayText(w)), 300);
}
$("spellForm").onsubmit = e => {
  e.preventDefault();
  if (G.answered) { G.i++; nextQ(); return; }
  const typed = $("ans").value.trim();
  if (!typed) { $("ans").focus(); return; }
  const ok = cur().alts.includes(norm(typed));
  $("ans").className = "answer " + (ok ? "ok" : "bad");
  grade(ok, typed);
};
$("skipBtn").onclick = () => grade(false, "");
$("nextBtn").onclick = () => { G.i++; nextQ(); };
$("fbSay").onclick = () => speak(sayText(cur()));
$("fbSpell").onclick = () => speak(spellOut(cur()), { rate: 0.75 });
document.addEventListener("keydown", e => {
  if ($("vGame").hidden || !G) return;
  if (e.key === "Enter" && G.answered && document.activeElement !== $("nextBtn")) { e.preventDefault(); G.i++; nextQ(); }
});

/* tiles */
let T = null;
function buildTiles(w) {
  const words = w.plain.split(" ");
  const letters = w.plain.replace(/ /g, "").split("");
  T = { words, filled: Array(letters.length).fill(null), letters: shuffle(letters.map((c, k) => ({ c, k }))) };
  // keep shuffling if it happens to be in order
  if (letters.length > 2 && T.letters.every((o, i) => o.k === i)) T.letters.reverse();
  renderTiles();
}
function renderTiles() {
  let pos = 0;
  $("slots").innerHTML = T.words.map(word => `<div class="slot-word">${word.split("").map(() => {
    const f = T.filled[pos]; const html = `<button type="button" class="slot ${f !== null ? "filled" : ""}" data-slot="${pos}" aria-label="第 ${pos + 1} 格">${f !== null ? esc(T.letters[f].c) : ""}</button>`; pos++; return html;
  }).join("")}</div>`).join("");
  $("tiles").innerHTML = T.letters.map((o, i) => `<button type="button" class="tile" data-tile="${i}" ${T.filled.includes(i) ? "disabled" : ""}>${esc(o.c)}</button>`).join("");
}
$("tiles").onclick = e => {
  const b = e.target.closest("[data-tile]"); if (!b || G.answered) return;
  const at = T.filled.indexOf(null); if (at < 0) return;
  T.filled[at] = +b.dataset.tile; renderTiles();
  if (!T.filled.includes(null)) checkTiles();
};
$("slots").onclick = e => {
  const b = e.target.closest("[data-slot]"); if (!b || G.answered) return;
  T.filled[+b.dataset.slot] = null; renderTiles();
};
$("tileClear").onclick = () => { if (G.answered) return; T.filled.fill(null); renderTiles(); };
$("tileSkip").onclick = () => { if (!G.answered) grade(false, ""); };
function checkTiles() {
  const w = cur();
  const target = w.plain.replace(/ /g, "");
  const got = T.filled.map(f => T.letters[f].c).join("");
  G.tries++;
  const slots = document.querySelectorAll(".slot");
  if (got.toLowerCase() === target.toLowerCase()) {
    slots.forEach(s => s.classList.add("ok"));
    grade(true, got);
  } else {
    slots.forEach((s, k) => s.classList.add(got[k].toLowerCase() === target[k].toLowerCase() ? "ok" : "bad"));
    if (G.tries >= 2) { grade(false, got); return; }
    setTimeout(() => { // remove only the wrong letters, keep the right ones
      T.filled = T.filled.map((f, k) => got[k].toLowerCase() === target[k].toLowerCase() ? f : null);
      renderTiles();
    }, 900);
  }
}

/* ---------- results ---------- */
function finish() {
  $("hBar").style.width = "100%";
  const r = G.results, okN = r.filter(x => x.ok).length, acc = Math.round(okN / r.length * 100);
  $("rAcc").textContent = acc + "%"; $("rScore").textContent = G.score; $("rBest").textContent = G.best;
  $("rMsg").textContent = acc === 100 ? "全對！這些字可以放心上考場了。" : acc >= 80 ? "很穩了，把紅色的字再練一次就完美。" : acc >= 60 ? "有基礎了，先用「只練錯的字」把紅字補起來。" : "先到「單字筆記」看音節、聽發音，再回來挑戰。";
  $("rList").innerHTML = r.map(x => { const w = byId[x.id]; return `<div class="ritem ${x.ok ? "ok" : "bad"}"><span class="mk">${x.ok ? "✔" : "✘"}</span><span class="t"><b>${esc(w.en)}</b><small>${esc(w.zh)}</small></span><button class="mini-say" data-say="${w.id}" aria-label="播放">${SPEAKER}</button></div>`; }).join("");
  $("rRetry").disabled = okN === r.length;
  show("vResult");
}
$("rList").onclick = e => { const s = e.target.closest("[data-say]"); if (s) speak(sayText(byId[s.dataset.say]), { btn: s }); };
$("rHome").onclick = () => { renderSetup(); show("vSetup"); };
$("rAgain").onclick = () => startGame(G.mode, shuffle(G.queue));

/* ---------- wrong book ---------- */
let wClearArmed = false;
function renderWrong() {
  const ids = myWrong().sort((a, b) => wrongBook[b] - wrongBook[a]);
  $("wList").innerHTML = ids.length ? ids.map(id => { const w = byId[id]; return `<div class="ritem bad"><span class="mk">${wrongBook[id]}</span><span class="t"><b>${esc(w.en)}</b><small>${w.grade === "7" ? "七" : "九"}年級 U${w.unit}・${esc(w.zh)}</small></span><button class="mini-say" data-say="${id}" aria-label="播放">${SPEAKER}</button></div>`; }).join("")
    : `<div class="empty">錯題本是空的。去玩「聽音拼字」，拼錯的字會自動收進來。</div>`;
  ["wSpell", "wTiles", "wClear"].forEach(b => $(b).disabled = !ids.length);
  wClearArmed = false; $("wClear").textContent = "清空錯題本";
  show("vWrong");
}
$("wList").onclick = e => { const s = e.target.closest("[data-say]"); if (s) speak(sayText(byId[s.dataset.say]), { btn: s }); };
const wrongWords = () => shuffle(myWrong().map(id => byId[id]));
$("wSpell").onclick = () => startGame("spell", wrongWords());
$("wTiles").onclick = () => startGame("tiles", wrongWords());
$("wClear").onclick = () => {
  if (!wClearArmed) { wClearArmed = true; $("wClear").textContent = "確定清空？再按一次"; return; }
  myWrong().forEach(id => delete wrongBook[id]); store.set("wrong", wrongBook); renderWrong();
};

if (LOCK_GRADE) {
  const g = LOCK_GRADE === "7" ? "國七上" : "國九上";
  prefs.grade = LOCK_GRADE;
  document.title = g + "單字拼字蜂";
  document.querySelector(".logo small").textContent = `翰林版 115 學年度・${g} L1–L2 段考單字`;
  $(LOCK_GRADE === "7" ? "g9" : "g7").hidden = true;
  $("g" + LOCK_GRADE).style.cursor = "default";
  document.querySelector("#vSetup .step h2").lastChild.textContent = "年級";
  document.querySelector("#vWrong .note").textContent = `這裡收集${g}拼錯過的字，數字是錯了幾次。在任何玩法中拼對，次數就會減一，減到零就畢業。`;
}
renderSetup();
</script>

</body></html>
